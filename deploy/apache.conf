ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# Source helpers and configuration are not downloadable web resources.
<FilesMatch "(^\.|\.(?:mjs|ini|env|md|ya?ml|sh|lock)$)">
    Require all denied
</FilesMatch>
