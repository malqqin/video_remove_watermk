version: '3.8'

services:
  api:
    build: .
    image: video-remove-watermk:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8000}:80"
    env_file:
      - /etc/video-remove-watermk/parser.env
    init: true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
